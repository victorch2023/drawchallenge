<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estadísticas — Draw Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell admin-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Draw Challenge</p>
        <h1>Estadísticas</h1>
      </div>
      <nav class="nav-links">
        <a href="admin.html" class="nav-link">Panel</a>
        <a href="index.html" class="nav-link">Dibujar</a>
      </nav>
    </header>

    <main class="admin-layout">
      <section class="card">
        <h2>Acceso</h2>
        <p class="hint">
          Usa el mismo valor que <code>ADMIN_TOKEN</code> en Vercel.
          No se envía a GitHub; solo a tu API.
        </p>
        <div class="add-keyword-row">
          <input
            id="admin-token"
            type="password"
            placeholder="ADMIN_TOKEN"
            autocomplete="current-password"
          >
          <button id="btn-load-stats" type="button" class="btn btn-primary">Cargar</button>
        </div>
        <div class="model-row" style="margin-top: 0.85rem;">
          <label for="analytics-api-url">API Vercel</label>
          <input
            id="analytics-api-url"
            type="url"
            placeholder="https://drawchallenge-five.vercel.app"
          >
        </div>
        <button id="btn-save-api" type="button" class="btn btn-secondary" style="margin-top: 0.75rem;">
          Guardar URL de API
        </button>
      </section>

      <section class="card" id="summary-card" hidden>
        <h2>Resumen</h2>
        <div class="stats-summary" id="stats-summary"></div>
      </section>

      <section class="card" id="table-card" hidden>
        <h2>Envíos</h2>
        <p class="hint small">Cada dispositivo anónimo aparece como usuario1, usuario2…</p>
        <div class="stats-table-wrap">
          <table class="stats-table" id="stats-table">
            <thead>
              <tr>
                <th>Usuario</th>
                <th>Palabra</th>
                <th>Nota</th>
                <th>Fecha y hora</th>
              </tr>
            </thead>
            <tbody id="stats-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <p id="stats-status" class="status-message" role="status" aria-live="polite"></p>
  </div>

  <script type="module" src="js/stats.js"></script>
</body>
</html>
